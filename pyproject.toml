[project]
name = "ccm"
version = "0.1.0"
description = "tmux/SSH manager for Claude Code agents"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ccm = "ccm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
